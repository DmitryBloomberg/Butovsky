services:
  web:
    build:
      context: ./Services/butovsky-web_site
      dockerfile: Dockerfile
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - site

  caddy:
    image: caddy:2-alpine
    depends_on:
      web:
        condition: service_healthy
    environment:
      DOMAIN: "${DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - site

networks:
  site:

volumes:
  caddy_data:
  caddy_config: